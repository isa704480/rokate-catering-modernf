# Decap CMS — панель редактирования сайта Rokate Catering.
# Этот файл создан автоматически из содержимого папки content/.
# Важно: все поля должны быть описаны здесь, иначе Decap удалит их при сохранении.

backend:
  name: github
  repo: isa704480/rokate-catering-modernf
  branch: main
  base_url: https://rokate-catering-modernf.vercel.app
  auth_endpoint: api/cms/auth
  commit_messages:
    create: 'Добавлено: {{collection}} "{{slug}}"'
    update: 'Изменено: {{collection}} "{{slug}}"'
    delete: 'Удалено: {{collection}} "{{slug}}"'
    uploadMedia: Загружен файл {{path}}
    deleteMedia: Удалён файл {{path}}
locale: ru
media_folder: public/uploads
public_folder: /uploads
collections:
- name: ru
  label: Сайт — русская версия
  editor:
